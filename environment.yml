name: credito-vivienda-mx
channels:
  - conda-forge
dependencies:
  - python=3.11

  # --- Núcleo: ingesta y manejo de datos ---
  - pandas
  - numpy
  - requests

  # --- Entorno de trabajo ---
  - jupyterlab

  # --- EDA ---
  - matplotlib
  - seaborn

  # --- Modelo de datos (panel en SQLite) ---
  - sqlalchemy

  # --- Modelado y baselines de series ---
  - scikit-learn
  - statsmodels

  # --- Tracking de experimentos (fase 4): tracking local a mlruns/, sin
  #     servidor ni base de datos. El registry y el servidor entran cuando el
  #     servicio los pida, no antes (D5: MLOps del tamaño correcto). ---
  - mlflow

  # --- Pruebas ---
  - pytest

# Nota de disciplina: las dependencias de servicio (fastapi, uvicorn) y
# contenedor se agregan en su fase (5), no antes. Adoptar herramienta solo
# cuando el proyecto la exige.
