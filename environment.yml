name: credito-vivienda-mx
channels:
  - conda-forge
dependencies:
  - python=3.11

  # --- Núcleo: ingesta y manejo de datos ---
  - pandas
  - numpy
  - requests

  # --- Entorno de trabajo ---
  - jupyterlab

  # --- EDA ---
  - matplotlib
  - seaborn

  # --- Modelo de datos (panel en SQLite) ---
  - sqlalchemy

  # --- Modelado y baselines de series ---
  - scikit-learn
  - statsmodels

  # --- Tracking de experimentos (fase 4): tracking local a mlflow.db +
  #     mlartifacts/, sin servidor remoto (D5). ---
  - mlflow

  # --- Servicio (fase 5): API que sirve las predicciones pre-computadas.
  #     El contenedor (Docker) es el paso siguiente, no una dependencia de conda. ---
  - fastapi
  - uvicorn

  # --- Pruebas ---
  - pytest

# Nota de disciplina: se adopta cada herramienta cuando su fase la exige, no antes.
